<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>소방업무공유</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
:root{
  --red:#e53e3e;--red-dark:#c53030;--red-light:#fff5f5;--red-border:#fed7d7;
  --orange:#dd6b20;--orange-light:#fffaf0;
  --green:#38a169;--green-light:#f0fff4;--green-border:#9ae6b4;
  --blue:#3182ce;--blue-light:#ebf8ff;--blue-border:#90cdf4;
  --purple:#805ad5;--purple-light:#faf5ff;--purple-border:#d6bcfa;
  --gray:#718096;--gray-light:#f7fafc;--gray-border:#e2e8f0;
  --text:#2d3748;--text2:#4a5568;--text3:#a0aec0;
  --surface:#ffffff;--bg:#f7fafc;
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
  --shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;padding-bottom:80px}
.header{background:var(--red);color:#fff;padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-md)}
.logo{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.header-right{display:flex;align-items:center;gap:8px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#68d391}
.sync-dot.syncing{background:#f6e05e;animation:pulse 1s infinite}
.sync-dot.error{background:#fc8181}
.user-badge{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px;font-size:12px;cursor:pointer}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--gray-border);display:flex;z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;border:none;background:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;color:var(--text3);font-size:10px;font-weight:500;gap:4px;transition:color .15s}
.nav-item.active{color:var(--red)}
.nav-icon{font-size:22px;line-height:1}
.page{display:none;padding:16px}.page.active{display:block}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.btn{padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--gray-border);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;color:var(--text2);transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn:active{opacity:.8}
.btn-red{background:var(--red);color:#fff;border-color:var(--red)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:var(--radius-xs)}
.btn-icon{padding:6px;border-radius:var(--radius-xs);min-width:32px;justify-content:center}
.btn-outline-red{color:var(--red);border-color:var(--red-border);background:var(--red-light)}
.btn-outline-green{color:var(--green);border-color:var(--green-border);background:var(--green-light)}
.btn-outline-blue{color:var(--blue);border-color:var(--blue-border);background:var(--blue-light)}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.b-red{background:var(--red-light);color:var(--red)}
.b-green{background:var(--green-light);color:var(--green)}
.b-blue{background:var(--blue-light);color:var(--blue)}
.b-orange{background:var(--orange-light);color:var(--orange)}
.b-purple{background:var(--purple-light);color:var(--purple)}
.b-gray{background:var(--gray-light);color:var(--gray)}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.form-label{font-size:12px;font-weight:600;color:var(--text2)}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--gray-border);border-radius:var(--radius-sm);font-size:14px;font-family:'Noto Sans KR',sans-serif;color:var(--text);background:var(--surface);outline:none;transition:border .15s;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
textarea{resize:vertical;min-height:80px}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;padding:20px;animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:36px;height:4px;background:var(--gray-border);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--text)}
.modal-footer{display:flex;gap:8px;margin-top:16px}
.modal-footer .btn{flex:1;justify-content:center}
.inv-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.inv-stat{background:var(--surface);border-radius:var(--radius-sm);padding:12px;text-align:center;box-shadow:var(--shadow)}
.inv-stat-num{font-size:24px;font-weight:700;font-family:monospace}
.inv-stat-label{font-size:11px;color:var(--text3);margin-top:2px}
.inv-search{display:flex;gap:8px;margin-bottom:12px}
.inv-search input{flex:1}
.item-card{background:var(--surface);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:14px;margin-bottom:10px;border-left:4px solid var(--gray-border)}
.item-card.low{border-left-color:var(--red)}
.item-card.ok{border-left-color:var(--green)}
.item-name{font-size:14px;font-weight:700;color:var(--text)}
.item-category{font-size:11px;color:var(--text3);margin-top:2px}
.item-qty-wrap{display:flex;align-items:center;gap:8px;margin-top:10px}
.qty-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--gray-border);background:var(--surface);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text2)}
.qty-display{font-size:22px;font-weight:700;font-family:monospace;min-width:60px;text-align:center}
.qty-display.low{color:var(--red)}
.qty-unit{font-size:12px;color:var(--text3)}
.log-list{margin-top:10px;border-top:1px solid var(--gray-border);padding-top:10px;display:none}
.log-list.open{display:block}
.log-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--gray-border);font-size:12px;gap:8px}
.log-row:last-child{border-bottom:none}
.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-ms-overflow-style:none;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{padding:6px 14px;border-radius:20px;border:1.5px solid var(--gray-border);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;color:var(--text2);white-space:nowrap;flex-shrink:0}
.cat-tab.active{background:var(--red);color:#fff;border-color:var(--red)}
.journal-filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-ms-overflow-style:none;scrollbar-width:none}
.journal-filter::-webkit-scrollbar{display:none}
.place-chip{padding:6px 14px;border-radius:20px;border:1.5px solid var(--gray-border);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:'Noto Sans KR',sans-serif;color:var(--text2)}
.place-chip.active{background:var(--red);color:#fff;border-color:var(--red)}
.journal-card{background:var(--surface);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.journal-card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.journal-place{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
.journal-place.hospital{background:var(--red-light);color:var(--red)}
.journal-place.univ{background:var(--blue-light);color:var(--blue)}
.journal-place.custom{background:var(--purple-light);color:var(--purple)}
.journal-content{font-size:13px;color:var(--text);line-height:1.7;white-space:pre-line}
.journal-date-group{font-size:12px;font-weight:700;color:var(--text3);padding:8px 0 4px;border-bottom:1px solid var(--gray-border);margin-bottom:8px}
.calendar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-month{font-size:16px;font-weight:700}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:16px}
.cal-dow{text-align:center;font-size:11px;font-weight:600;color:var(--text3);padding:4px 0}
.cal-dow:first-child{color:var(--red)}
.cal-dow:last-child{color:var(--blue)}
.cal-day{aspect-ratio:1;border-radius:var(--radius-xs);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 2px;cursor:pointer;transition:background .1s}
.cal-day:hover{background:var(--gray-light)}
.cal-day.today .cal-num{background:var(--red);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.cal-day.selected{background:var(--red-light)}
.cal-day.other-month .cal-num{color:var(--text3)}
.cal-day.sun .cal-num{color:var(--red)}
.cal-day.sat .cal-num{color:var(--blue)}
.cal-num{font-size:13px;font-weight:500;line-height:24px}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.cal-dot{width:5px;height:5px;border-radius:50%}
.sch-item{background:var(--surface);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:8px;border-left:4px solid var(--red);display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.sch-title{font-size:14px;font-weight:600;color:var(--text)}
.sch-meta{font-size:11px;color:var(--text3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.sch-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.selected-date-label{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;padding:8px 0;border-bottom:1px solid var(--gray-border)}
.settings-section{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.settings-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--text)}
.firebase-status{padding:10px 14px;border-radius:var(--radius-sm);font-size:12px;margin-bottom:12px}
.firebase-status.connected{background:var(--green-light);color:var(--green);border:1px solid var(--green-border)}
.firebase-status.disconnected{background:var(--gray-light);color:var(--gray);border:1px solid var(--gray-border)}
.toast-wrap{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--text);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;animation:tin .2s ease;white-space:nowrap}
.toast.success{background:var(--green)}.toast.error{background:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.empty{text-align:center;padding:48px 20px;color:var(--text3)}
.empty-icon{font-size:40px;margin-bottom:10px}
.divider{height:1px;background:var(--gray-border);margin:12px 0}
.fab{position:fixed;bottom:88px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 12px rgba(229,62,62,.4);display:flex;align-items:center;justify-content:center;z-index:90}
.fab:active{transform:scale(.93)}
@media(min-width:540px){
  .modal{border-radius:var(--radius)}
  .modal-overlay{align-items:center}
  .page{max-width:540px;margin:0 auto}
  .bottom-nav{max-width:540px;left:50%;transform:translateX(-50%)}
  .fab{right:calc(50% - 270px + 20px)}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">🔥 소방업무공유</div>
  <div class="header-right">
    <div class="sync-dot" id="syncDot"></div>
    <div class="user-badge" id="userBadge" onclick="openModal('setUser')">👤 나</div>
  </div>
</div>

<!-- 재고관리 -->
<div class="page active" id="page-inv">
  <div class="inv-summary" id="invSummary"></div>
  <div class="cat-tabs" id="catTabs"></div>
  <div class="inv-search">
    <input type="text" id="invSearch" placeholder="🔍 품목 검색..." oninput="renderInv()">
    <button class="btn btn-sm" onclick="openAddItem()">+ 추가</button>
  </div>
  <div id="invList"></div>
</div>

<!-- 업무일지 -->
<div class="page" id="page-journal">
  <div class="journal-filter" id="journalFilter"></div>
  <div id="journalList"></div>
</div>

<!-- 일정 -->
<div class="page" id="page-schedule">
  <div class="card" style="padding:12px">
    <div class="calendar-header">
      <button class="btn btn-sm btn-icon" onclick="moveMonth(-1)">‹</button>
      <div class="cal-month" id="calMonth"></div>
      <button class="btn btn-sm btn-icon" onclick="moveMonth(1)">›</button>
    </div>
    <div class="calendar-grid" id="calGrid"></div>
  </div>
  <div class="selected-date-label" id="selectedDateLabel"></div>
  <div id="scheduleList"></div>
</div>

<!-- 설정 -->
<div class="page" id="page-settings">
  <div class="settings-section">
    <div class="settings-title">🔥 Firebase 실시간 연동</div>
    <div class="firebase-status disconnected" id="firebaseStatus">⚪ 연결 중...</div>
  </div>
  <div class="settings-section">
    <div class="settings-title">🏥 장소 관리</div>
    <div style="margin-bottom:10px">
      <div style="font-size:12px;font-weight:600;color:var(--text3);margin-bottom:8px">병원</div>
      <div id="hospitalList" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>
      <div style="display:flex;gap:8px">
        <input type="text" id="newHospital" placeholder="병원 이름 추가" style="flex:1">
        <button class="btn btn-sm btn-outline-red" onclick="addPlace('hospital')">추가</button>
      </div>
    </div>
    <div class="divider"></div>
    <div>
      <div style="font-size:12px;font-weight:600;color:var(--text3);margin-bottom:8px">대학</div>
      <div id="univList" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>
      <div style="display:flex;gap:8px">
        <input type="text" id="newUniv" placeholder="대학 이름 추가" style="flex:1">
        <button class="btn btn-sm btn-outline-blue" onclick="addPlace('univ')">추가</button>
      </div>
    </div>
  </div>
  <div class="settings-section">
    <div class="settings-title">📦 재고 카테고리 관리</div>
    <div id="catManageList" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>
    <div style="display:flex;gap:8px">
      <input type="text" id="newCat" placeholder="카테고리 추가">
      <button class="btn btn-sm btn-outline-red" onclick="addCategory()">추가</button>
    </div>
  </div>
  <div class="settings-section">
    <div class="settings-title">👤 내 정보</div>
    <div class="form-group">
      <label class="form-label">이름</label>
      <input type="text" id="settingsName" placeholder="이름을 입력해 주세요">
    </div>
    <button class="btn btn-red btn-sm" onclick="saveName()" style="width:100%;justify-content:center">저장</button>
  </div>
  <div class="settings-section">
    <div class="settings-title">💾 데이터 관리</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-sm" onclick="exportData()">📤 백업</button>
      <button class="btn btn-sm" onclick="importClick()">📥 복원</button>
      <button class="btn btn-sm btn-outline-red" onclick="confirmReset()">⚠️ 초기화</button>
    </div>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="doImport(event)">
  </div>
</div>

<div class="bottom-nav">
  <button class="nav-item active" data-page="inv" onclick="switchPage('inv')">
    <span class="nav-icon">📦</span>재고관리
  </button>
  <button class="nav-item" data-page="journal" onclick="switchPage('journal')">
    <span class="nav-icon">📝</span>업무일지
  </button>
  <button class="nav-item" data-page="schedule" onclick="switchPage('schedule')">
    <span class="nav-icon">📅</span>일정
  </button>
  <button class="nav-item" data-page="settings" onclick="switchPage('settings')">
    <span class="nav-icon">⚙️</span>설정
  </button>
</div>

<button class="fab" id="fabBtn" onclick="fabAction()">＋</button>

<!-- 모달: 이름 설정 -->
<div class="modal-overlay" id="modal-setUser">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">👤 이름 설정</div>
    <div class="form-group">
      <input type="text" id="userNameInput" placeholder="이름을 입력해 주세요">
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('setUser')">취소</button>
      <button class="btn btn-red" onclick="saveUserName()">저장</button>
    </div>
  </div>
</div>

<!-- 모달: 품목 추가/수정 -->
<div class="modal-overlay" id="modal-addItem">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="addItemTitle">품목 추가</div>
    <input type="hidden" id="item_id">
    <div class="form-group">
      <label class="form-label">품목명 *</label>
      <input type="text" id="item_name" placeholder="예: 소화기 (ABC형 3kg)">
    </div>
    <div class="input-row">
      <div class="form-group">
        <label class="form-label">카테고리</label>
        <select id="item_cat"></select>
      </div>
      <div class="form-group">
        <label class="form-label">단위</label>
        <input type="text" id="item_unit" placeholder="개, 본, 롤...">
      </div>
    </div>
    <div class="input-row">
      <div class="form-group">
        <label class="form-label">현재 수량 *</label>
        <input type="number" id="item_qty" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label class="form-label">최소 수량 (부족 알림)</label>
        <input type="number" id="item_min" placeholder="0" min="0">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">메모 (보관위치, 규격 등)</label>
      <input type="text" id="item_memo" placeholder="3층 창고 A선반">
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('addItem')">취소</button>
      <button class="btn btn-red" onclick="saveItem()">저장</button>
    </div>
  </div>
</div>

<!-- 모달: 입출고 -->
<div class="modal-overlay" id="modal-txn">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="txnTitle">입출고</div>
    <input type="hidden" id="txn_itemId">
    <div class="form-group">
      <label class="form-label">구분</label>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline-green" id="txnInBtn" onclick="setTxnType('in')" style="flex:1;justify-content:center">📥 입고</button>
        <button class="btn btn-outline-red" id="txnOutBtn" onclick="setTxnType('out')" style="flex:1;justify-content:center">📤 출고</button>
      </div>
      <input type="hidden" id="txn_type">
    </div>
    <div class="form-group">
      <label class="form-label">수량 *</label>
      <input type="number" id="txn_qty" placeholder="수량 입력" min="1">
    </div>
    <div class="form-group">
      <label class="form-label">메모</label>
      <input type="text" id="txn_memo" placeholder="사유, 담당자 등">
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('txn')">취소</button>
      <button class="btn btn-red" onclick="saveTxn()">저장</button>
    </div>
  </div>
</div>

<!-- 모달: 업무일지 -->

      <div class="form-group">
        <label class="form-label">날짜 *</label>

        <option value="회의">💬 회의</option>

      <label class="form-label">메모</label>

      <button class="btn btn-red" onclick="saveSchedule()">저장</button>

<div class="toast-wrap" id="toastWrap"></div>

<script>
let curPage='inv',curCat='전체',curJF='전체';
let calYear,calMonth,selDate;
let db={items:[],txns:[],journals:[],schedules:[],
  categories:['소화기류','호스·관창','감지기','밸브류','기타'],
  hospitals:['원주세브란스병원','원주기독병원'],
  univs:['연세대학교 미래캠퍼스','상지대학교']};
let userName='';
let firebaseRef=null;

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCL37JohDOJ0fbCVrhGHys_7jEEO8zfE2U",
  authDomain: "fire-safety-6ba08.firebaseapp.com",
  databaseURL: "https://fire-safety-6ba08-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "fire-safety-6ba08",
  storageBucket: "fire-safety-6ba08.firebasestorage.app",
  messagingSenderId: "585109331074",
  appId: "1:585109331074:web:b1a5764ca868196684689b"
};

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const tod=()=>new Date().toISOString().slice(0,10);
const getW=()=>userName||'익명';

function init(){
  const now=new Date();
  calYear=now.getFullYear();calMonth=now.getMonth();selDate=tod();
  try{const d=localStorage.getItem('fb_db');if(d)db=Object.assign(db,JSON.parse(d));}catch{}
  userName=localStorage.getItem('fb_user')||'';
  updateUserBadge();
  initFirebase(FIREBASE_CONFIG);
  renderInv();renderJournal();renderCalendar();renderScheduleList();renderSettings();
}
function saveLocal(){localStorage.setItem('fb_db',JSON.stringify(db));if(firebaseRef)pushFB();}
function updateUserBadge(){document.getElementById('userBadge').textContent='👤 '+(userName||'나');}

/* Firebase */
function connectFirebase(){
  const raw=document.getElementById('fbConfigInput').value.trim();
  try{
    const m=raw.match(/\{[\s\S]*\}/);if(!m)throw 0;
    const cfg=eval('('+m[0]+')');
    if(!cfg.databaseURL)throw new Error('databaseURL 없음');
    localStorage.setItem('fb_cfg',JSON.stringify(cfg));
    initFirebase(cfg);
  }catch(e){toast('firebaseConfig 형식을 확인해 주세요 (databaseURL 필수)','error');}
}
function initFirebase(cfg){
  if(typeof firebase==='undefined'){
    let n=0;
    ['https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js',
     'https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js'].forEach(src=>{
      const s=document.createElement('script');s.src=src;
      s.onload=()=>{if(++n===2)setupFB(cfg);};document.head.appendChild(s);
    });
  }else setupFB(cfg);
}
function setupFB(cfg){
  try{
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    firebaseRef=firebase.database().ref('sobangtm');
    firebaseRef.on('value',snap=>{
      const d=snap.val();
      if(d){db=Object.assign(db,d);localStorage.setItem('fb_db',JSON.stringify(db));renderCurrent();}
      setSyncStatus('ok');
      document.getElementById('firebaseStatus').className='firebase-status connected';
      document.getElementById('firebaseStatus').textContent='🟢 Firebase 연결됨 — 실시간 동기화 중';
    });
    toast('Firebase 연결됐습니다! 실시간 동기화 시작','success');
  }catch(e){toast('Firebase 오류: '+e.message,'error');setSyncStatus('error');}
}
function pushFB(){
  if(!firebaseRef)return;setSyncStatus('syncing');
  firebaseRef.set(db).then(()=>setSyncStatus('ok')).catch(()=>setSyncStatus('error'));
}
function setSyncStatus(s){
  document.getElementById('syncDot').className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');
}

/* 페이지 */
function switchPage(p){
  curPage=p;
  document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id==='page-'+p));
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.page===p));
  document.getElementById('fabBtn').style.display=p==='settings'?'none':'flex';
  renderCurrent();
}
function renderCurrent(){
  if(curPage==='inv')renderInv();
  if(curPage==='journal')renderJournal();
  if(curPage==='schedule'){renderCalendar();renderScheduleList();}
  if(curPage==='settings')renderSettings();
}
function fabAction(){
  if(curPage==='inv')openAddItem();
  if(curPage==='journal')openAddJournal();
  if(curPage==='schedule')openAddSchedule();
}

/* ── 재고관리 ── */
function renderInv(){
  const cats=['전체',...db.categories];
  document.getElementById('catTabs').innerHTML=cats.map(c=>
    `<button class="cat-tab${c===curCat?' active':''}" onclick="setCat('${c}')">${c}</button>`).join('');
  const q=document.getElementById('invSearch').value.trim().toLowerCase();
  let items=db.items.filter(it=>{
    if(curCat!=='전체'&&it.cat!==curCat)return false;
    if(q&&!it.name.toLowerCase().includes(q))return false;
    return true;
  });
  const total=db.items.length;
  const low=db.items.filter(it=>it.min>0&&it.qty<=it.min).length;
  document.getElementById('invSummary').innerHTML=`
    <div class="inv-stat"><div class="inv-stat-num" style="color:var(--blue)">${total}</div><div class="inv-stat-label">전체 품목</div></div>
    <div class="inv-stat"><div class="inv-stat-num" style="color:var(--red)">${low}</div><div class="inv-stat-label">부족 품목</div></div>
    <div class="inv-stat"><div class="inv-stat-num" style="color:var(--green)">${total-low}</div><div class="inv-stat-label">정상 품목</div></div>`;
  if(!items.length){
    document.getElementById('invList').innerHTML='<div class="empty"><div class="empty-icon">📦</div><div class="empty-text">등록된 품목이 없어요<br>+ 버튼으로 추가해 주세요</div></div>';return;
  }
  items.sort((a,b)=>{
    const al=a.min>0&&a.qty<=a.min?0:1,bl=b.min>0&&b.qty<=b.min?0:1;
    return al!==bl?al-bl:a.name.localeCompare(b.name);
  });
  document.getElementById('invList').innerHTML=items.map(it=>{
    const isLow=it.min>0&&it.qty<=it.min;
    const logs=(db.txns||[]).filter(t=>t.itemId===it.id).slice(-3).reverse();
    return `<div class="item-card ${isLow?'low':'ok'}">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
        <div style="flex:1;min-width:0">
          <div class="item-name">${it.name}</div>
          <div class="item-category">${it.cat||''}${it.memo?' · '+it.memo:''}</div>
        </div>
        <div style="display:flex;gap:5px;flex-shrink:0">
          <button class="btn btn-xs btn-outline-blue" onclick="openTxn('${it.id}')">입출고</button>
          <button class="btn btn-xs" onclick="openEditItem('${it.id}')">수정</button>
          <button class="btn btn-xs btn-outline-red" onclick="deleteItem('${it.id}')">삭제</button>
        </div>
      </div>
      <div class="item-qty-wrap">
        <button class="qty-btn" onclick="quickQty('${it.id}',-1)" style="color:var(--red)">−</button>
        <div style="text-align:center">
          <div class="qty-display${isLow?' low':''}">${it.qty}</div>
          <div class="qty-unit">${it.unit||'개'}</div>
        </div>
        <button class="qty-btn" onclick="quickQty('${it.id}',1)" style="color:var(--green)">＋</button>
        ${it.min>0?`<span class="badge ${isLow?'b-red':'b-green'}">${isLow?'⚠ 부족':'✓ 충분'}</span>`:''}
      </div>
      ${it.min>0?`<div style="font-size:11px;color:var(--text3);margin-top:4px">최소 기준: ${it.min} ${it.unit||'개'}</div>`:''}
      ${logs.length?`<button class="btn btn-xs" style="margin-top:8px;color:var(--text3);border:none;padding:4px 0" onclick="toggleLog('${it.id}')">📋 최근 입출고 내역</button>
        <div class="log-list" id="log-${it.id}">
          ${logs.map(t=>`<div class="log-row">
            <span class="badge ${t.type==='in'?'b-green':'b-red'}">${t.type==='in'?'입고':'출고'}</span>
            <span style="font-weight:600">${t.type==='in'?'+':'-'}${t.qty} ${it.unit||'개'}</span>
            <span style="color:var(--text3);flex:1;text-align:center">${t.memo||''}</span>
            <span style="color:var(--text3)">${t.date||''} ${t.by||''}</span>
          </div>`).join('')}
        </div>`:''}
    </div>`;
  }).join('');
}
function setCat(c){curCat=c;renderInv();}
function toggleLog(id){const el=document.getElementById('log-'+id);if(el)el.classList.toggle('open');}
function openAddItem(){
  document.getElementById('item_id').value='';
  document.getElementById('addItemTitle').textContent='품목 추가';
  ['item_name','item_qty','item_min','item_unit','item_memo'].forEach(id=>document.getElementById(id).value='');
  renderItemCatSel();openModal('addItem');
}
function openEditItem(id){
  const it=db.items.find(x=>x.id===id);if(!it)return;
  document.getElementById('item_id').value=id;
  document.getElementById('addItemTitle').textContent='품목 수정';
  document.getElementById('item_name').value=it.name;
  document.getElementById('item_qty').value=it.qty;
  document.getElementById('item_min').value=it.min||'';
  document.getElementById('item_unit').value=it.unit||'';
  document.getElementById('item_memo').value=it.memo||'';
  renderItemCatSel(it.cat);openModal('addItem');
}
function renderItemCatSel(cur){
  document.getElementById('item_cat').innerHTML=db.categories.map(c=>`<option value="${c}"${c===cur?' selected':''}>${c}</option>`).join('');
}
function saveItem(){
  const id=document.getElementById('item_id').value;
  const name=document.getElementById('item_name').value.trim();
  const qty=parseInt(document.getElementById('item_qty').value)||0;
  const min=parseInt(document.getElementById('item_min').value)||0;
  const unit=document.getElementById('item_unit').value.trim()||'개';
  const memo=document.getElementById('item_memo').value.trim();
  const cat=document.getElementById('item_cat').value;
  if(!name){toast('품목명을 입력해 주세요','error');return;}
  if(id){const it=db.items.find(x=>x.id===id);if(it)Object.assign(it,{name,qty,min,unit,memo,cat});}
  else db.items.push({id:uid(),name,qty,min,unit,memo,cat,createdAt:tod(),by:getW()});
  saveLocal();closeModal('addItem');renderInv();toast(id?'수정됐습니다':'추가됐습니다','success');
}
function deleteItem(id){
  if(!confirm('삭제하시겠습니까?'))return;
  db.items=db.items.filter(x=>x.id!==id);
  db.txns=(db.txns||[]).filter(x=>x.itemId!==id);
  saveLocal();renderInv();toast('삭제됐습니다');
}
function quickQty(id,d){
  const it=db.items.find(x=>x.id===id);if(!it)return;
  it.qty=Math.max(0,it.qty+d);
  db.txns=db.txns||[];
  db.txns.push({id:uid(),itemId:id,type:d>0?'in':'out',qty:Math.abs(d),memo:'빠른조정',date:tod(),by:getW()});
  saveLocal();renderInv();
}
function openTxn(id){
  const it=db.items.find(x=>x.id===id);if(!it)return;
  document.getElementById('txn_itemId').value=id;
  document.getElementById('txnTitle').textContent=it.name+' 입출고';
  document.getElementById('txn_qty').value='';
  document.getElementById('txn_memo').value='';
  document.getElementById('txn_type').value='';
  document.getElementById('txnInBtn').style.fontWeight='400';
  document.getElementById('txnOutBtn').style.fontWeight='400';
  openModal('txn');
}
function setTxnType(t){
  document.getElementById('txn_type').value=t;
  document.getElementById('txnInBtn').style.fontWeight=t==='in'?'700':'400';
  document.getElementById('txnOutBtn').style.fontWeight=t==='out'?'700':'400';
}
function saveTxn(){
  const id=document.getElementById('txn_itemId').value;
  const type=document.getElementById('txn_type').value;
  const qty=parseInt(document.getElementById('txn_qty').value)||0;
  const memo=document.getElementById('txn_memo').value.trim();
  if(!type){toast('입고/출고를 선택해 주세요','error');return;}
  if(!qty||qty<1){toast('수량을 입력해 주세요','error');return;}
  const it=db.items.find(x=>x.id===id);if(!it)return;
  if(type==='out'&&it.qty<qty){toast('재고가 부족합니다 (현재: '+it.qty+')','error');return;}
  it.qty=type==='in'?it.qty+qty:it.qty-qty;
  db.txns=db.txns||[];
  db.txns.push({id:uid(),itemId:id,type,qty,memo,date:tod(),by:getW()});
  saveLocal();closeModal('txn');renderInv();
  toast((type==='in'?'입고 ':'출고 ')+qty+(it.unit||'개')+' 처리됐습니다','success');
}

/* ── 업무일지 ── */
function allPlaces(){return [...db.hospitals,...db.univs];}
function getPlaceType(p){return db.hospitals.includes(p)?'hospital':db.univs.includes(p)?'univ':'custom';}
function openAddJournal(editId){
  const j=editId?db.journals.find(x=>x.id===editId):null;
  document.getElementById('jrn_id').value=j?j.id:'';
  document.getElementById('addJrnTitle').textContent=j?'업무일지 수정':'업무일지 작성';
  document.getElementById('jrn_date').value=j?j.date:tod();
  document.getElementById('jrn_content').value=j?j.content:'';
  const all=allPlaces();
  document.getElementById('jrn_place').innerHTML=all.map(p=>`<option value="${p}"${j&&j.place===p?' selected':''}>${p}</option>`).join('');
  openModal('addJournal');
}
function saveJournal(){
  const id=document.getElementById('jrn_id').value;
  const date=document.getElementById('jrn_date').value;
  const place=document.getElementById('jrn_place').value;
  const content=document.getElementById('jrn_content').value.trim();
  if(!date||!place||!content){toast('날짜, 장소, 내용은 필수입니다','error');return;}
  if(id){const j=db.journals.find(x=>x.id===id);if(j)Object.assign(j,{date,place,placeType:getPlaceType(place),content});}
  else db.journals.push({id:uid(),date,place,placeType:getPlaceType(place),content,createdAt:new Date().toISOString(),by:getW()});
  saveLocal();closeModal('addJournal');renderJournal();toast('저장됐습니다','success');
}
function deleteJournal(id){
  if(!confirm('삭제하시겠습니까?'))return;
  db.journals=db.journals.filter(x=>x.id!==id);
  saveLocal();renderJournal();toast('삭제됐습니다');
}
function renderJournal(){
  const all=['전체',...db.hospitals,...db.univs];
  document.getElementById('journalFilter').innerHTML=all.map(p=>
    `<div class="place-chip${p===curJF?' active':''}" onclick="setJF('${p}')">${p}</div>`).join('');
  let list=[...db.journals].sort((a,b)=>b.date.localeCompare(a.date));
  if(curJF!=='전체')list=list.filter(j=>j.place===curJF);
  if(!list.length){
    document.getElementById('journalList').innerHTML='<div class="empty"><div class="empty-icon">📝</div><div class="empty-text">업무일지가 없어요<br>+ 버튼으로 오늘 업무를 기록해 보세요</div></div>';return;
  }
  const grouped={};list.forEach(j=>{(grouped[j.date]=grouped[j.date]||[]).push(j);});
  document.getElementById('journalList').innerHTML=Object.entries(grouped).map(([date,items])=>`
    <div class="journal-date-group">${date}</div>
    ${items.map(j=>`<div class="journal-card">
      <div class="journal-card-head">
        <span class="journal-place ${j.placeType||'custom'}">${j.place}</span>
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:11px;color:var(--text3)">${j.by||''}</span>
          <button class="btn btn-xs" onclick="openAddJournal('${j.id}')">수정</button>
          <button class="btn btn-xs btn-outline-red" onclick="deleteJournal('${j.id}')">삭제</button>
        </div>
      </div>
      <div class="journal-content">${j.content}</div>
    </div>`).join('')}`).join('');
}
function setJF(f){curJF=f;renderJournal();}

/* ── 일정 ── */
const catColor={점검:'var(--red)',교육:'var(--blue)',회의:'var(--green)',공사:'var(--orange)',기타:'var(--purple)'};
function renderCalendar(){
  document.getElementById('calMonth').textContent=`${calYear}년 ${calMonth+1}월`;
  const first=new Date(calYear,calMonth,1).getDay();
  const last=new Date(calYear,calMonth+1,0).getDate();
  const schMap={};
  db.schedules.forEach(s=>{(schMap[s.date]=schMap[s.date]||[]).push(s);});
  const dows=['일','월','화','수','목','금','토'];
  let h=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const pl=new Date(calYear,calMonth,0).getDate();
  for(let i=first-1;i>=0;i--)h+=`<div class="cal-day other-month"><span class="cal-num">${pl-i}</span></div>`;
  for(let d=1;d<=last;d++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isT=ds===tod(),isSel=ds===selDate,dow=(first+d-1)%7;
    const dots=(schMap[ds]||[]);
    h+=`<div class="cal-day${isT?' today':''}${isSel?' selected':''} ${dow===0?'sun':dow===6?'sat':''}" onclick="selectDate('${ds}')">
      <span class="cal-num">${d}</span>
      <div class="cal-dots">${dots.slice(0,3).map(s=>`<div class="cal-dot" style="background:${catColor[s.cat]||'var(--gray)'}"></div>`).join('')}</div>
    </div>`;
  }
  const rem=(7-(first+last)%7)%7;
  for(let i=1;i<=rem;i++)h+=`<div class="cal-day other-month"><span class="cal-num">${i}</span></div>`;
  document.getElementById('calGrid').innerHTML=h;
}
function selectDate(d){selDate=d;renderCalendar();renderScheduleList();}
function moveMonth(d){calMonth+=d;if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;}renderCalendar();}
function renderScheduleList(){
  document.getElementById('selectedDateLabel').textContent=selDate?`${selDate} 일정`:'일정';
  const list=db.schedules.filter(s=>!selDate||s.date===selDate).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  if(!list.length){document.getElementById('scheduleList').innerHTML='<div class="empty" style="padding:24px"><div class="empty-text">이 날 일정이 없어요</div></div>';return;}
  document.getElementById('scheduleList').innerHTML=list.map(s=>`
    <div class="sch-item">
      <div class="sch-dot" style="background:${catColor[s.cat]||'var(--gray)'}"></div>
      <div style="flex:1;min-width:0">
        <div class="sch-title">${s.title}</div>
        <div class="sch-meta">
          <span>${s.time||'종일'}</span>
          <span class="badge b-gray">${s.cat||'기타'}</span>
          ${s.memo?`<span>${s.memo}</span>`:''}
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:3px">${s.by||''}</div>
      </div>
      <div style="display:flex;gap:4px;flex-direction:column">
        <button class="btn btn-xs" onclick="editSchedule('${s.id}')">수정</button>
        <button class="btn btn-xs btn-outline-red" onclick="deleteSchedule('${s.id}')">삭제</button>
      </div>
    </div>`).join('');
}
function openAddSchedule(){
  document.getElementById('sch_id').value='';
  document.getElementById('addSchTitle').textContent='일정 추가';
  document.getElementById('sch_title').value='';
  document.getElementById('sch_date').value=selDate||tod();
  document.getElementById('sch_time').value='';
  document.getElementById('sch_cat').value='점검';
  document.getElementById('sch_memo').value='';
  openModal('addSchedule');
}
function editSchedule(id){
  const s=db.schedules.find(x=>x.id===id);if(!s)return;
  document.getElementById('sch_id').value=id;
  document.getElementById('addSchTitle').textContent='일정 수정';
  document.getElementById('sch_title').value=s.title;
  document.getElementById('sch_date').value=s.date;
  document.getElementById('sch_time').value=s.time||'';
  document.getElementById('sch_cat').value=s.cat||'점검';
  document.getElementById('sch_memo').value=s.memo||'';
  openModal('addSchedule');
}
function saveSchedule(){
  const id=document.getElementById('sch_id').value;
  const title=document.getElementById('sch_title').value.trim();
  const date=document.getElementById('sch_date').value;
  const time=document.getElementById('sch_time').value;
  const cat=document.getElementById('sch_cat').value;
  const memo=document.getElementById('sch_memo').value.trim();
  if(!title||!date){toast('제목과 날짜는 필수입니다','error');return;}
  if(id){const s=db.schedules.find(x=>x.id===id);if(s)Object.assign(s,{title,date,time,cat,memo});}
  else db.schedules.push({id:uid(),title,date,time,cat,memo,by:getW()});
  selDate=date;saveLocal();closeModal('addSchedule');renderCalendar();renderScheduleList();
  toast('저장됐습니다','success');
}
function deleteSchedule(id){
  if(!confirm('삭제하시겠습니까?'))return;
  db.schedules=db.schedules.filter(x=>x.id!==id);
  saveLocal();renderCalendar();renderScheduleList();toast('삭제됐습니다');
}

/* ── 설정 ── */
function renderSettings(){
  document.getElementById('hospitalList').innerHTML=db.hospitals.map(h=>`
    <div style="display:flex;align-items:center;gap:4px">
      <span class="badge b-red">${h}</span>
      <button class="btn btn-xs" style="padding:1px 5px;color:var(--text3);border:none" onclick="removePlace('hospital','${h}')">×</button>
    </div>`).join('');
  document.getElementById('univList').innerHTML=db.univs.map(u=>`
    <div style="display:flex;align-items:center;gap:4px">
      <span class="badge b-blue">${u}</span>
      <button class="btn btn-xs" style="padding:1px 5px;color:var(--text3);border:none" onclick="removePlace('univ','${u}')">×</button>
    </div>`).join('');
  document.getElementById('catManageList').innerHTML=db.categories.map(c=>`
    <div style="display:flex;align-items:center;gap:4px">
      <span class="badge b-gray">${c}</span>
      <button class="btn btn-xs" style="padding:1px 5px;color:var(--text3);border:none" onclick="removeCat('${c}')">×</button>
    </div>`).join('');
  document.getElementById('settingsName').value=userName;
}
function addPlace(type){
  const inp=document.getElementById(type==='hospital'?'newHospital':'newUniv');
  const val=inp.value.trim();if(!val)return;
  if(type==='hospital'){if(!db.hospitals.includes(val))db.hospitals.push(val);}
  else{if(!db.univs.includes(val))db.univs.push(val);}
  inp.value='';saveLocal();renderSettings();toast('추가됐습니다','success');
}
function removePlace(type,val){
  if(type==='hospital')db.hospitals=db.hospitals.filter(x=>x!==val);
  else db.univs=db.univs.filter(x=>x!==val);
  saveLocal();renderSettings();toast('삭제됐습니다');
}
function addCategory(){
  const val=document.getElementById('newCat').value.trim();if(!val)return;
  if(!db.categories.includes(val))db.categories.push(val);
  document.getElementById('newCat').value='';saveLocal();renderSettings();renderInv();toast('추가됐습니다','success');
}
function removeCat(val){
  db.categories=db.categories.filter(x=>x!==val);saveLocal();renderSettings();renderInv();
}
function saveName(){
  const n=document.getElementById('settingsName').value.trim();if(!n){toast('이름을 입력해 주세요','error');return;}
  userName=n;localStorage.setItem('fb_user',n);updateUserBadge();toast('저장됐습니다','success');
}

/* ── 사용자 모달 ── */
function saveUserName(){
  const v=document.getElementById('userNameInput').value.trim();
  if(!v){toast('이름을 입력해 주세요','error');return;}
  userName=v;localStorage.setItem('fb_user',v);updateUserBadge();closeModal('setUser');
  document.getElementById('settingsName').value=v;
  toast('안녕하세요, '+v+'님!','success');
}

/* ── 모달 ── */
function openModal(name){
  if(!userName&&name!=='setUser'){document.getElementById('userNameInput').value='';openModal('setUser');return;}
  document.getElementById('modal-'+name).classList.add('open');
}
function closeModal(name){document.getElementById('modal-'+name).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(el=>{
  el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open');});
});

/* ── 데이터 관리 ── */
function exportData(){
  const a=document.createElement('a');
  a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(db,null,2));
  a.download='소방업무공유_백업_'+tod()+'.json';a.click();
}
function importClick(){document.getElementById('importFile').click();}
function doImport(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{db=Object.assign(db,JSON.parse(ev.target.result));saveLocal();renderCurrent();renderSettings();toast('복원됐습니다','success');}catch{toast('파일 형식이 올바르지 않습니다','error');}};
  r.readAsText(f);
}
function confirmReset(){
  if(!confirm('모든 데이터를 초기화합니다. 계속하시겠습니까?'))return;
  if(!confirm('정말 초기화하시겠습니까?'))return;
  db={items:[],txns:[],journals:[],schedules:[],categories:['소화기류','호스·관창','감지기','밸브류','기타'],hospitals:['원주세브란스병원','원주기독병원'],univs:['연세대학교 미래캠퍼스','상지대학교']};
  saveLocal();renderCurrent();renderSettings();toast('초기화됐습니다');
}

/* ── Toast ── */
function toast(msg,type=''){
  const el=document.createElement('div');
  el.className='toast'+(type?' '+type:'');el.textContent=msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(()=>el.remove(),2800);
}

init();
if(!userName)setTimeout(()=>{document.getElementById('userNameInput').value='';openModal('setUser');},500);
</script>
</body>
</html>
